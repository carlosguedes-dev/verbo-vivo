<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EE"/>
      <stop offset="50%" stop-color="#F3EBDD"/>
      <stop offset="100%" stop-color="#FAF6EE"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A640F"/>
      <stop offset="50%" stop-color="#B3871C"/>
      <stop offset="100%" stop-color="#8A640F"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="420" rx="22" fill="url(#bg)" stroke="#B3871C" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Emblem Cross & Open Bible -->
  <g transform="translate(547, 42)">
    <rect x="0" y="0" width="86" height="86" rx="20" fill="#121622" stroke="url(#gold)" stroke-width="2.4"/>
    <rect x="4" y="4" width="78" height="78" rx="16" stroke="url(#gold)" stroke-width="0.8" stroke-opacity="0.35" fill="none"/>
    <circle cx="43" cy="31" r="16" stroke="url(#gold)" stroke-width="1.1" stroke-opacity="0.45" fill="none"/>
    <g stroke="url(#gold)" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
      <line x1="43" y1="9" x2="43" y2="12"/>
      <line x1="26" y1="16" x2="29" y2="19"/>
      <line x1="60" y1="16" x2="57" y2="19"/>
    </g>
    <path d="M14 63 V39 C24 36 34 38 43 43 C52 38 62 36 72 39 V63 C62 60 52 62 43 67 C34 62 24 60 14 63 Z" fill="#181D2B" stroke="url(#gold)" stroke-width="2"/>
    <path d="M18 58 V36 C26 33 35 35 43 40 V62 C35 57 26 55 18 58 Z" fill="#FAF4E4" stroke="url(#gold)" stroke-width="1.6"/>
    <path d="M68 58 V36 C60 33 51 35 43 40 V62 C51 57 60 55 68 58 Z" fill="#FAF4E4" stroke="url(#gold)" stroke-width="1.6"/>
    <line x1="43" y1="39" x2="43" y2="66" stroke="url(#gold)" stroke-width="2.2"/>
    <path d="M40 65 L40 75 L43 72 L46 75 L46 65 Z" fill="#B52B3D" stroke="url(#gold)" stroke-width="0.8"/>
    <path d="M40.2 13 H45.8 V23 H55 V28.2 H45.8 V45 H40.2 V28.2 H31 V23 H40.2 Z" fill="#E5C158" stroke="#FFF7D6" stroke-width="0.6"/>
    <circle cx="43" cy="25.6" r="2.2" fill="#FFF7D6"/>
  </g>

  <!-- Eyebrow Pill -->
  <g transform="translate(590, 162)" text-anchor="middle">
    <rect x="-220" y="-16" width="440" height="26" rx="13" fill="rgba(179,135,28,0.12)" stroke="rgba(179,135,28,0.4)"/>
    <text y="2" fill="#8A640F" font-size="11.5" font-weight="700" letter-spacing="2" class="mono">
      SOLA SCRIPTURA • 66 LIVROS CANÔNICOS • FÉ EVANGÉLICA
    </text>
  </g>

  <!-- Main Title -->
  <text x="590" y="228" text-anchor="middle" fill="#1F1B16" font-size="50" font-weight="700" class="serif">
    VERBO VIVO
  </text>
  <text x="590" y="264" text-anchor="middle" fill="#8A640F" font-size="20" font-style="italic" class="serif">
    Bíblia Sagrada (ACF, NVI, ARA) • Central Tira-Dúvidas Bereano • Refúgio &amp; Vida Cristã
  </text>

  <!-- Scripture Quote -->
  <text x="590" y="308" text-anchor="middle" fill="#4A4236" font-size="15" class="sans">
    "Porque a palavra de Deus é viva e eficaz, e mais penetrante do que espada alguma de dois gumes." — Hebreus 4:12
  </text>

  <!-- Feature Pills -->
  <g transform="translate(590, 362)" text-anchor="middle" class="mono" font-size="12" font-weight="600">
    <g transform="translate(-390, 0)">
      <rect x="-85" y="-16" width="170" height="30" rx="8" fill="#FFFFFF" stroke="rgba(179,135,28,0.4)"/>
      <text y="4" fill="#1F1B16">📖 31.102 Versículos</text>
    </g>
    <g transform="translate(-195, 0)">
      <rect x="-85" y="-16" width="170" height="30" rx="8" fill="#FFFFFF" stroke="rgba(179,135,28,0.4)"/>
      <text y="4" fill="#1F1B16">⚖️ ACF • NVI • ARA</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-90" y="-16" width="180" height="30" rx="8" fill="#FFFFFF" stroke="rgba(179,135,28,0.4)"/>
      <text y="4" fill="#1F1B16">💡 Tira-Dúvidas Bíblico</text>
    </g>
    <g transform="translate(195, 0)">
      <rect x="-85" y="-16" width="170" height="30" rx="8" fill="#FFFFFF" stroke="rgba(179,135,28,0.4)"/>
      <text y="4" fill="#1F1B16">📱 Android • iOS • Win</text>
    </g>
    <g transform="translate(390, 0)">
      <rect x="-85" y="-16" width="170" height="30" rx="8" fill="#FFFFFF" stroke="rgba(179,135,28,0.4)"/>
      <text y="4" fill="#1F1B16">🙏 Altar de Oração</text>
    </g>
  </g>
