      <stop offset="50%" stop-color="#161920"/>
      <stop offset="100%" stop-color="#0E1014"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBD08A"/>
      <stop offset="45%" stop-color="#CFA84E"/>
      <stop offset="100%" stop-color="#9A7520"/>
    </linearGradient>

    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECD392"/>
      <stop offset="50%" stop-color="#CFA84E"/>
      <stop offset="100%" stop-color="#BE953B"/>
    </linearGradient>

    <linearGradient id="card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D222C"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>

    <linearGradient id="plat-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2029"/>
      <stop offset="100%" stop-color="#151920"/>
