    <circle cx="42" cy="30" r="15" stroke="url(#gold-grad)" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M14 62 V38 C24 35 34 37 42 42 C50 37 60 35 70 38 V62 C60 59 50 61 42 66 C34 61 24 59 14 62 Z" fill="#121622" stroke="url(#gold-grad)" stroke-width="2"/>
    <path d="M18 57 V35 C26 32 35 34 42 39 V61 C35 56 26 54 18 57 Z" fill="url(#parchment-l)" stroke="url(#gold-grad)" stroke-width="1.5"/>
    <path d="M66 57 V35 C58 32 49 34 42 39 V61 C49 56 58 54 66 57 Z" fill="url(#parchment-r)" stroke="url(#gold-grad)" stroke-width="1.5"/>
    <line x1="42" y1="38" x2="42" y2="65" stroke="url(#gold-grad)" stroke-width="2"/>
    <path d="M39 64 L39 74 L42 71 L45 74 L45 64 Z" fill="#9E2D3B" stroke="url(#gold-grad)" stroke-width="0.8"/>
    <path d="M39.3 13 H44.7 V22.5 H54 V27.5 H44.7 V44 H39.3 V27.5 H30 V22.5 H39.3 Z" fill="url(#gold-grad)" stroke="#FFF7D6" stroke-width="0.5"/>

