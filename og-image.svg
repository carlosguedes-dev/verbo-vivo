      <g transform="translate(204, 0)">
        <rect width="190" height="72" rx="11" fill="#151921" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="16" y="28" fill="#CFA84E" font-size="11" font-weight="700" class="mono">DICIONÁRIO BÍBLICO</text>
        <text x="16" y="50" fill="#F2EFE7" font-size="14.5" font-weight="600" class="sans">1.154 Palavras • A–Z</text>
      </g>
      <g transform="translate(0, 84)">
        <rect width="190" height="72" rx="11" fill="#151921" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="16" y="28" fill="#CFA84E" font-size="11" font-weight="700" class="mono">REFÚGIO NA PALAVRA</text>
        <text x="16" y="50" fill="#F2EFE7" font-size="14.5" font-weight="600" class="sans">Apenas Escrituras</text>
