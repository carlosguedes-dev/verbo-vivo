        <text x="16" y="28" fill="#CFA84E" font-size="11" font-weight="700" class="mono">ESTUDO PESSOAL</text>
        <text x="16" y="50" fill="#F2EFE7" font-size="14.5" font-weight="600" class="sans">Tira-Dúvidas &amp; Notas</text>
      </g>
