<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111317"/>
      <stop offset="50%" stop-color="#171A21"/>
      <stop offset="100%" stop-color="#111317"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFB963"/>
      <stop offset="50%" stop-color="#CFA84E"/>
      <stop offset="100%" stop-color="#E7CA82"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="420" rx="20" fill="url(#bg)" stroke="#CFA84E" stroke-opacity="0.32" stroke-width="1.5"/>

  <!-- Emblem Cross & Open Bible -->
  <g transform="translate(547, 40)">
    <rect x="0" y="0" width="86" height="86" rx="20" fill="#0F1218" stroke="url(#gold)" stroke-width="2.2"/>
    <rect x="4" y="4" width="78" height="78" rx="16" stroke="url(#gold)" stroke-width="0.8" stroke-opacity="0.35" fill="none"/>
    <circle cx="43" cy="31" r="16" stroke="url(#gold)" stroke-width="1.1" stroke-opacity="0.45" fill="none"/>
    <path d="M14 63 V39 C24 36 34 38 43 43 C52 38 62 36 72 39 V63 C62 60 52 62 43 67 C34 62 24 60 14 63 Z" fill="#121622" stroke="url(#gold)" stroke-width="2"/>
    <path d="M18 58 V36 C26 33 35 35 43 40 V62 C35 57 26 55 18 58 Z" fill="#F2E6CC" stroke="url(#gold)" stroke-width="1.6"/>
    <path d="M68 58 V36 C60 33 51 35 43 40 V62 C51 57 60 55 68 58 Z" fill="#F2E6CC" stroke="url(#gold)" stroke-width="1.6"/>
    <line x1="43" y1="39" x2="43" y2="66" stroke="url(#gold)" stroke-width="2.2"/>
    <path d="M40 65 L40 75 L43 72 L46 75 L46 65 Z" fill="#9E2D3B" stroke="url(#gold)" stroke-width="0.8"/>
    <path d="M40.2 13 H45.8 V23 H55 V28.2 H45.8 V45 H40.2 V28.2 H31 V23 H40.2 Z" fill="url(#gold)" stroke="#FFF7D6" stroke-width="0.6"/>
  </g>

  <!-- Eyebrow -->
  <text x="590" y="160" text-anchor="middle" fill="#CFA84E" font-size="11.5" font-weight="700" letter-spacing="2.4" class="mono">
    SOLA SCRIPTURA • 66 LIVROS CANÔNICOS • VERSÃO 3.3.2
  </text>

  <!-- Main Title -->
  <text x="590" y="222" text-anchor="middle" fill="#F2EFE7" font-size="52" font-weight="700" class="serif">
    VERBO VIVO
  </text>
  <text x="590" y="258" text-anchor="middle" fill="#CFA84E" font-size="20" font-style="italic" class="serif">
    Bíblia Sagrada (ACF, NVI, ARA) • Dicionário Bíblico (A–Z) • Refúgio nas Escrituras
  </text>

  <!-- Scripture Quote -->
  <text x="590" y="302" text-anchor="middle" fill="#B7B0A2" font-size="15" class="sans">
    "Porque a palavra de Deus é viva e eficaz, e mais penetrante do que espada alguma de dois gumes." — Hebreus 4:12
  </text>

  <!-- Feature Pills -->
  <g transform="translate(590, 358)" text-anchor="middle" class="sans" font-size="12.5" font-weight="600">
    <g transform="translate(-390, 0)">
      <rect x="-86" y="-17" width="172" height="32" rx="8" fill="#1B1F27" stroke="rgba(207,168,78,0.32)"/>
      <text y="4" fill="#F2EFE7">ACF • NVI • ARA</text>
    </g>
    <g transform="translate(-195, 0)">
      <rect x="-86" y="-17" width="172" height="32" rx="8" fill="#1B1F27" stroke="rgba(207,168,78,0.32)"/>
      <text y="4" fill="#F2EFE7">1.154 Palavras • A–Z</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-86" y="-17" width="172" height="32" rx="8" fill="#1B1F27" stroke="rgba(207,168,78,0.32)"/>
      <text y="4" fill="#F2EFE7">Refúgio na Palavra</text>
    </g>
    <g transform="translate(195, 0)">
      <rect x="-86" y="-17" width="172" height="32" rx="8" fill="#1B1F27" stroke="rgba(207,168,78,0.32)"/>
      <text y="4" fill="#F2EFE7">Tira-Dúvidas</text>
    </g>
    <g transform="translate(390, 0)">
      <rect x="-86" y="-17" width="172" height="32" rx="8" fill="#1B1F27" stroke="rgba(207,168,78,0.32)"/>
      <text y="4" fill="#F2EFE7">Android • iOS • Win</text>
    </g>
  </g>
</svg>
