<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D12"/>
      <stop offset="50%" stop-color="#131722"/>
      <stop offset="100%" stop-color="#0E1118"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F3D77D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1180" height="420" rx="22" fill="url(#bg)" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="2"/>
  <rect width="1180" height="420" rx="22" fill="url(#glow)"/>

  <!-- Emblem Cross & Open Bible -->
  <g transform="translate(590, 88)">
    <circle cx="0" cy="0" r="42" fill="#171C28" stroke="url(#gold)" stroke-width="2"/>
    <path d="M-20 16V-4C-20 -7 -12 -9 0 -4C12 -9 20 -7 20 -4V16C20 13 12 11 0 16C-12 11 -20 13 -20 16Z" stroke="url(#gold)" stroke-width="2.2" fill="none"/>
    <path d="M0 -4V16" stroke="url(#gold)" stroke-width="2"/>
    <path d="M0 -26V-2M-8 -18H8" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- Eyebrow Pill -->
  <g transform="translate(590, 162)" text-anchor="middle">
    <rect x="-220" y="-16" width="440" height="26" rx="13" fill="rgba(212,175,55,0.12)" stroke="rgba(212,175,55,0.4)"/>
    <text y="2" fill="#E5C158" font-size="11.5" font-weight="700" letter-spacing="2" class="mono">
      SOLA SCRIPTURA • 66 LIVROS CANÔNICOS • FÉ EVANGÉLICA
    </text>
  </g>

  <!-- Main Title -->
  <text x="590" y="228" text-anchor="middle" fill="#F7F3EA" font-size="50" font-weight="700" class="serif">
    VERBO VIVO
  </text>
  <text x="590" y="264" text-anchor="middle" fill="#D4AF37" font-size="20" font-style="italic" class="serif">
    Bíblia Sagrada (ACF, NVI, ARA) • Central Tira-Dúvidas Bereano • Refúgio &amp; Vida Cristã
  </text>

  <!-- Scripture Quote -->
  <text x="590" y="308" text-anchor="middle" fill="#B9B2A3" font-size="15" class="sans">
    "Porque a palavra de Deus é viva e eficaz, e mais penetrante do que espada alguma de dois gumes." — Hebreus 4:12
  </text>

  <!-- Feature Pills -->
  <g transform="translate(590, 362)" text-anchor="middle" class="mono" font-size="12" font-weight="600">
    <g transform="translate(-390, 0)">
      <rect x="-85" y="-16" width="170" height="30" rx="8" fill="#171C28" stroke="rgba(212,175,55,0.35)"/>
      <text y="4" fill="#F4F0E8">📖 31.102 Versículos</text>
    </g>
    <g transform="translate(-195, 0)">
      <rect x="-85" y="-16" width="170" height="30" rx="8" fill="#171C28" stroke="rgba(212,175,55,0.35)"/>
      <text y="4" fill="#F4F0E8">⚖️ ACF • NVI • ARA</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-90" y="-16" width="180" height="30" rx="8" fill="#171C28" stroke="rgba(212,175,55,0.35)"/>
      <text y="4" fill="#F4F0E8">💡 Tira-Dúvidas Bíblico</text>
    </g>
    <g transform="translate(195, 0)">
      <rect x="-85" y="-16" width="170" height="30" rx="8" fill="#171C28" stroke="rgba(212,175,55,0.35)"/>
      <text y="4" fill="#F4F0E8">🎵 Harpa &amp; 5 Solas</text>
    </g>
    <g transform="translate(390, 0)">
      <rect x="-85" y="-16" width="170" height="30" rx="8" fill="#171C28" stroke="rgba(212,175,55,0.35)"/>
      <text y="4" fill="#F4F0E8">🙏 Altar de Oração</text>
    </g>
  </g>
</svg>
