<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <style>
      .serif { font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; }
      .sans { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, ui-monospace, monospace; }
    </style>

    <!-- Deep Sanctuary Obsidian Canvas -->
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E16"/>
      <stop offset="48%" stop-color="#101521"/>
      <stop offset="100%" stop-color="#080A10"/>
    </linearGradient>

    <!-- Ambient Gold Spotlight (Left Hero) -->
    <radialGradient id="aura-left" cx="24%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#D4AF37" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B0D12" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Gold Spotlight (Right App Card) -->
    <radialGradient id="aura-right" cx="78%" cy="52%" r="46%">
      <stop offset="0%" stop-color="#F5DC8B" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0D12" stop-opacity="0"/>
    </radialGradient>

    <!-- Imperial Gold Metallic Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BE"/>
      <stop offset="28%" stop-color="#F1D27A"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#A67E19"/>
      <stop offset="100%" stop-color="#7B5A0C"/>
    </linearGradient>

    <!-- Horizontal Gold Text Gradient -->
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7E094"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#C89D28"/>
    </linearGradient>

    <!-- App Preview Card Surface -->
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171D2B"/>
      <stop offset="55%" stop-color="#121722"/>
      <stop offset="100%" stop-color="#0D1018"/>
    </linearGradient>

    <!-- Platform Card Surface -->
    <linearGradient id="plat-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181F2E"/>
      <stop offset="100%" stop-color="#111520"/>
    </linearGradient>

    <!-- Parchment Pages Gradient -->
    <linearGradient id="parchment-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4E4"/>
      <stop offset="70%" stop-color="#E8D8B8"/>
      <stop offset="100%" stop-color="#C6AD7E"/>
    </linearGradient>

    <linearGradient id="parchment-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF4E4"/>
      <stop offset="70%" stop-color="#E8D8B8"/>
      <stop offset="100%" stop-color="#C6AD7E"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Background & Sacred Spotlights -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#aura-left)"/>
  <rect width="1200" height="630" fill="url(#aura-right)"/>

  <!-- Subtle Architectural Sanctuary Grid -->
  <g stroke="#D4AF37" stroke-opacity="0.045" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Outer Sanctuary Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="22" stroke="url(#gold-grad)" stroke-opacity="0.42" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="574" rx="16" stroke="url(#gold-grad)" stroke-opacity="0.14" stroke-width="1"/>

  <!-- =======================================================================
       LEFT COLUMN: BRAND IDENTITY, EDITORIAL HEADLINE & PLATFORM DOWNLOADS
       ======================================================================= -->

  <!-- Top Brand Row: Sculpted App Icon + Official Eyebrow Pill -->
  <g transform="translate(64, 58)">
    <!-- Sculpted Verbo Vivo App Icon (86x86) -->
    <g filter="url(#icon-shadow)">
      <rect x="0" y="0" width="86" height="86" rx="20" fill="#0D111A" stroke="url(#gold-grad)" stroke-width="2.4"/>
      <rect x="4" y="4" width="78" height="78" rx="16" stroke="url(#gold-grad)" stroke-width="0.8" stroke-opacity="0.35"/>
      <circle cx="43" cy="31" r="16" stroke="url(#gold-grad)" stroke-width="1.1" stroke-opacity="0.45"/>
      <!-- Radiant Rays -->
      <g stroke="url(#gold-grad)" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
        <line x1="43" y1="9" x2="43" y2="12"/>
        <line x1="26" y1="16" x2="29" y2="19"/>
        <line x1="60" y1="16" x2="57" y2="19"/>
      </g>
      <!-- Open Bible Cover & Pages -->
      <path d="M14 63 V39 C24 36 34 38 43 43 C52 38 62 36 72 39 V63 C62 60 52 62 43 67 C34 62 24 60 14 63 Z" fill="#121622" stroke="url(#gold-grad)" stroke-width="2"/>
      <path d="M18 58 V36 C26 33 35 35 43 40 V62 C35 57 26 55 18 58 Z" fill="url(#parchment-l)" stroke="url(#gold-grad)" stroke-width="1.6"/>
      <path d="M68 58 V36 C60 33 51 35 43 40 V62 C51 57 60 55 68 58 Z" fill="url(#parchment-r)" stroke="url(#gold-grad)" stroke-width="1.6"/>
      <line x1="43" y1="39" x2="43" y2="66" stroke="url(#gold-grad)" stroke-width="2.2"/>
      <!-- Ribbon -->
      <path d="M40 65 L40 75 L43 72 L46 75 L46 65 Z" fill="#B52B3D" stroke="url(#gold-grad)" stroke-width="0.8"/>
      <!-- Cross -->
      <path d="M40.2 13 H45.8 V23 H55 V28.2 H45.8 V45 H40.2 V28.2 H31 V23 H40.2 Z" fill="url(#gold-grad)" stroke="#FFF7D6" stroke-width="0.6"/>
      <circle cx="43" cy="25.6" r="2.2" fill="#FFF7D6"/>
    </g>

    <!-- Brand Name & Eyebrow Badges -->
    <g transform="translate(106, 8)">
      <g>
        <rect x="0" y="0" width="400" height="28" rx="14" fill="rgba(212, 175, 55, 0.14)" stroke="rgba(212, 175, 55, 0.45)" stroke-width="1.2"/>
        <text x="200" y="18" text-anchor="middle" fill="#F1D27A" font-size="11.5" font-weight="700" letter-spacing="1.5" class="mono">
          APLICATIVO OFICIAL • 100% OFFLINE &amp; GRATUITO
        </text>
      </g>
      <text x="2" y="66" fill="#F6F2E9" font-size="38" font-weight="700" letter-spacing="0.4" class="serif">
        Verbo Vivo
      </text>
      <text x="234" y="63" fill="#B5AE9E" font-size="15.5" font-weight="500" class="sans">
        •  Hebreus 4:12  •  v2.0.0
      </text>
    </g>
  </g>

  <!-- Main Hero Headline -->
  <g transform="translate(64, 210)">
    <text x="0" y="0" fill="#F7F4EC" font-size="56" font-weight="700" class="serif">
      A Palavra de Deus,
    </text>
    <text x="0" y="60" fill="url(#gold-text)" font-size="56" font-weight="700" font-style="italic" class="serif">
      no seu dispositivo.
    </text>

    <!-- Editorial Description -->
    <text x="0" y="112" fill="#D5CFC2" font-size="18.5" font-weight="400" class="sans">
      Baixe o app oficial para <tspan fill="#F5DC8B" font-weight="700">Android</tspan>, <tspan fill="#F5DC8B" font-weight="700">iPhone (iOS)</tspan> e <tspan fill="#F5DC8B" font-weight="700">Windows</tspan>.
    </text>
    <text x="0" y="140" fill="#ABA393" font-size="16.5" font-weight="400" class="sans">
      Bíblia Sagrada nas 3 traduções (ACF, NVI e ARA), Tira-Dúvidas
    </text>
    <text x="0" y="165" fill="#ABA393" font-size="16.5" font-weight="400" class="sans">
      Bereano, Refúgio Bíblico, Devocional, Planos e Altar de Oração.
    </text>
  </g>

  <!-- 3 Official Platform Download Badges (Bottom Left) -->
  <g transform="translate(64, 430)">
    <text x="0" y="-14" fill="#D4AF37" font-size="11.5" font-weight="700" letter-spacing="1.8" class="mono">
      DOWNLOAD DIRETO DISPONÍVEL PARA AS 3 PLATAFORMAS:
    </text>

    <!-- Card 1: Android -->
    <g transform="translate(0, 4)">
      <rect width="192" height="114" rx="14" fill="url(#plat-surface)" stroke="rgba(212, 175, 55, 0.38)" stroke-width="1.5"/>
      <rect x="14" y="14" width="36" height="36" rx="9" fill="rgba(212, 175, 55, 0.14)" stroke="rgba(212, 175, 55, 0.4)"/>
      <!-- Smartphone Icon -->
      <rect x="25" y="21" width="14" height="22" rx="2.5" stroke="#F1D27A" stroke-width="1.8"/>
      <circle cx="32" cy="39" r="1" fill="#F1D27A"/>
      <text x="60" y="30" fill="#F1D27A" font-size="10.5" font-weight="700" letter-spacing="1" class="mono">ANDROID 8+</text>
      <text x="60" y="47" fill="#F7F4EC" font-size="17" font-weight="700" class="sans">Android</text>
      <text x="14" y="76" fill="#B5AE9E" font-size="12.5" class="sans">Pacote Instalável</text>
      <rect x="14" y="84" width="164" height="20" rx="5" fill="rgba(212, 175, 55, 0.12)"/>
      <text x="96" y="98" text-anchor="middle" fill="#F5DC8B" font-size="11" font-weight="600" class="mono">↓ Verbo-Vivo-Android.apk</text>
    </g>

    <!-- Card 2: iPhone / iOS -->
    <g transform="translate(206, 4)">
      <rect width="192" height="114" rx="14" fill="url(#plat-surface)" stroke="rgba(212, 175, 55, 0.38)" stroke-width="1.5"/>
      <rect x="14" y="14" width="36" height="36" rx="9" fill="rgba(212, 175, 55, 0.14)" stroke="rgba(212, 175, 55, 0.4)"/>
      <!-- iOS Icon -->
      <rect x="25" y="21" width="14" height="22" rx="3" stroke="#F1D27A" stroke-width="1.8"/>
      <line x1="29" y1="24" x2="35" y2="24" stroke="#F1D27A" stroke-width="1.5" stroke-linecap="round"/>
      <text x="60" y="30" fill="#F1D27A" font-size="10.5" font-weight="700" letter-spacing="1" class="mono">IOS 15+ • IPAD</text>
      <text x="60" y="47" fill="#F7F4EC" font-size="17" font-weight="700" class="sans">iPhone (iOS)</text>
      <text x="14" y="76" fill="#B5AE9E" font-size="12.5" class="sans">Pacote .IPA &amp; WebApp</text>
      <rect x="14" y="84" width="164" height="20" rx="5" fill="rgba(212, 175, 55, 0.12)"/>
      <text x="96" y="98" text-anchor="middle" fill="#F5DC8B" font-size="11" font-weight="600" class="mono">↓ Verbo-Vivo-iOS.ipa</text>
    </g>

    <!-- Card 3: Windows -->
    <g transform="translate(412, 4)">
      <rect width="196" height="114" rx="14" fill="url(#plat-surface)" stroke="rgba(212, 175, 55, 0.38)" stroke-width="1.5"/>
      <rect x="14" y="14" width="36" height="36" rx="9" fill="rgba(212, 175, 55, 0.14)" stroke="rgba(212, 175, 55, 0.4)"/>
      <!-- Desktop Monitor Icon -->
      <rect x="22" y="22" width="20" height="14" rx="2" stroke="#F1D27A" stroke-width="1.8"/>
      <line x1="27" y1="41" x2="37" y2="41" stroke="#F1D27A" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="32" y1="36" x2="32" y2="41" stroke="#F1D27A" stroke-width="1.8"/>
      <text x="60" y="30" fill="#F1D27A" font-size="10.5" font-weight="700" letter-spacing="1" class="mono">WIN 10 / 11</text>
      <text x="60" y="47" fill="#F7F4EC" font-size="17" font-weight="700" class="sans">Windows</text>
      <text x="14" y="76" fill="#B5AE9E" font-size="12.5" class="sans">Instalador &amp; Portátil</text>
      <rect x="14" y="84" width="168" height="20" rx="5" fill="rgba(212, 175, 55, 0.12)"/>
      <text x="98" y="98" text-anchor="middle" fill="#F5DC8B" font-size="11" font-weight="600" class="mono">↓ Setup &amp; Portable .EXE</text>
    </g>
  </g>

  <!-- =======================================================================
       RIGHT COLUMN: SANCTUARY APP INTERFACE PREVIEW CARD
       ======================================================================= -->
  <g transform="translate(702, 56)" filter="url(#card-shadow)">
    <!-- Main App Window Frame -->
    <rect x="0" y="0" width="442" height="518" rx="22" fill="url(#card-surface)" stroke="url(#gold-grad)" stroke-width="2"/>

    <!-- Window Top Header Bar -->
    <rect x="2" y="2" width="438" height="56" rx="20" fill="#0E121B"/>
    <line x1="2" y1="58" x2="440" y2="58" stroke="rgba(212, 175, 55, 0.25)" stroke-width="1"/>

    <!-- Window Controls & Active Translation Pills -->
    <circle cx="24" cy="30" r="5" fill="#D4AF37" fill-opacity="0.85"/>
    <circle cx="40" cy="30" r="5" fill="#D4AF37" fill-opacity="0.45"/>
    <circle cx="56" cy="30" r="5" fill="#D4AF37" fill-opacity="0.22"/>

    <text x="76" y="35" fill="#F4F1EA" font-size="14" font-weight="700" class="sans">
      Bíblia Sagrada • 66 Livros
    </text>

    <!-- ACF | NVI | ARA Pill -->
    <rect x="308" y="16" width="114" height="28" rx="8" fill="rgba(212, 175, 55, 0.16)" stroke="rgba(212, 175, 55, 0.45)"/>
    <text x="365" y="34" text-anchor="middle" fill="#F5DC8B" font-size="11" font-weight="700" class="mono">
      ACF • NVI • ARA
    </text>

    <!-- Center Emblem & Scripture Spotlight Inside App Preview -->
    <g transform="translate(24, 78)">
      <rect width="394" height="196" rx="16" fill="#0B0E15" stroke="rgba(212, 175, 55, 0.32)" stroke-width="1.2"/>

      <text x="197" y="30" text-anchor="middle" fill="#D4AF37" font-size="10.5" font-weight="700" letter-spacing="1.8" class="mono">
        ESCRITURAS SAGRADAS • SOLA SCRIPTURA
      </text>

      <text x="197" y="68" text-anchor="middle" fill="#F7F4EC" font-size="21" font-style="italic" font-weight="600" class="serif">
        "Porque a palavra de Deus é viva e
      </text>
      <text x="197" y="96" text-anchor="middle" fill="#F7F4EC" font-size="21" font-style="italic" font-weight="600" class="serif">
        eficaz, e mais penetrante do que
      </text>
      <text x="197" y="124" text-anchor="middle" fill="#F5DC8B" font-size="21" font-style="italic" font-weight="600" class="serif">
        espada alguma de dois gumes."
      </text>

      <line x1="137" y1="144" x2="257" y2="144" stroke="rgba(212, 175, 55, 0.35)" stroke-width="1"/>

      <text x="197" y="168" text-anchor="middle" fill="#E5C158" font-size="12.5" font-weight="700" letter-spacing="1.2" class="mono">
        HEBREUS 4:12 • ALMEIDA CORRIGIDA FIEL
      </text>
    </g>

    <!-- 4 Integrated App Modules Grid Inside Preview -->
    <g transform="translate(24, 292)">
      <!-- Module 1 -->
      <g transform="translate(0, 0)">
        <rect width="190" height="72" rx="12" fill="#131926" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="16" y="28" fill="#F5DC8B" font-size="11" font-weight="700" class="mono">01 • ESCRITURAS</text>
        <text x="16" y="50" fill="#F4F1EA" font-size="14.5" font-weight="600" class="sans">31.102 Versículos</text>
      </g>
      <!-- Module 2 -->
      <g transform="translate(204, 0)">
        <rect width="190" height="72" rx="12" fill="#131926" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="16" y="28" fill="#F5DC8B" font-size="11" font-weight="700" class="mono">02 • ATOS 17:11</text>
        <text x="16" y="50" fill="#F4F1EA" font-size="14.5" font-weight="600" class="sans">Tira-Dúvidas Bereano</text>
      </g>
      <!-- Module 3 -->
      <g transform="translate(0, 84)">
        <rect width="190" height="72" rx="12" fill="#131926" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="16" y="28" fill="#F5DC8B" font-size="11" font-weight="700" class="mono">03 • SALMOS 46:1</text>
        <text x="16" y="50" fill="#F4F1EA" font-size="14.5" font-weight="600" class="sans">Refúgio &amp; Devocional</text>
      </g>
      <!-- Module 4 -->
      <g transform="translate(204, 84)">
        <rect width="190" height="72" rx="12" fill="#131926" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="16" y="28" fill="#F5DC8B" font-size="11" font-weight="700" class="mono">04 • MATEUS 6:6</text>
        <text x="16" y="50" fill="#F4F1EA" font-size="14.5" font-weight="600" class="sans">Altar &amp; Caderno</text>
      </g>
    </g>

    <!-- Bottom Gold Call-To-Action Banner Inside App Card -->
    <g transform="translate(24, 462)">
      <rect width="394" height="36" rx="10" fill="url(#gold-grad)"/>
      <text x="197" y="23" text-anchor="middle" fill="#0B0D12" font-size="12.5" font-weight="800" letter-spacing="0.8" class="mono">
        ★ SEM ANÚNCIOS • CÓDIGO ABERTO • 100% OFFLINE
      </text>
    </g>
  </g>
</svg>
